name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
        - { name: Windows VS2026, os: windows-2025 }
        - { name: Linux GCC,      os: ubuntu-26.04 }
        - { name: Linux Clang,    os: ubuntu-26.04, flags: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ }

    steps:

    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install clang xorg-dev libxinerama-dev libxrandr-dev libxcursor-dev libxi-dev libudev-dev libopenal-dev libflac-dev libvorbis-dev libfreetype-dev libharfbuzz-dev libgl1-mesa-dev libegl1-mesa-dev libmbedtls-dev libssh2-1-dev

    - name: Prepare Vulkan SDK
      uses: humbletim/setup-vulkan-sdk@v1.2.1
      with:
        vulkan-query-version: 1.3.250.1
        vulkan-use-cache: true

    - name: Configure
      env:
        CMAKE_FLAGS: ${{ matrix.platform.flags }}
      run: cmake -S . -B build $CMAKE_FLAGS

    - name: Build
      run: cmake --build build --config Release
